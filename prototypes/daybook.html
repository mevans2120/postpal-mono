<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PostPal — Daybook (interactive prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Petrona:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Albert+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--paper:#faf6f0;--card:#fff;--ink:#2b2118;--mut:#7a6c5c;--clay:#c4674a;--clay-deep:#8a4630;--clay-soft:#f3e4d3;--pine:#3d5a4c;--pine-soft:#e4ebe6;--line:#e6ddd1}
  *{box-sizing:border-box;margin:0;padding:0}
  body{max-width:430px;margin:0 auto;min-height:100dvh;background:var(--paper);font-family:'Albert Sans',sans-serif;color:var(--ink)}
  #page{padding:22px 24px 120px}
  #page h1{font-family:'Petrona',serif;font-weight:500;font-size:24.5px;line-height:1.36}

  /* dev-only day switcher — deliberately not product-styled */
  #day-switcher{position:fixed;top:10px;right:10px;display:flex;gap:4px;z-index:100}
  .day-pill{font-family:'Albert Sans',sans-serif;font-size:11px;font-weight:600;color:#888;background:#eee;border:1px solid #ccc;border-radius:10px;padding:3px 8px;cursor:pointer}
</style>
</head>
<body>
<div id="day-switcher" aria-label="Prototype day switcher (dev control)">
  <button class="day-pill" data-day="1">1</button>
  <button class="day-pill" data-day="3">3</button>
  <button class="day-pill" data-day="5">5</button>
  <button class="day-pill" data-day="10">10</button>
  <button class="day-pill" data-day="20">20</button>
</div>

<main id="page">
  <h1>The Daybook — placeholder (Petrona)</h1>
</main>

<nav id="nextbar"></nav>

<div id="sheet-root"></div>
</body>
</html>
