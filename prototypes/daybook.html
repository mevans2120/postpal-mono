<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PostPal — Daybook (interactive prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Petrona:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Albert+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Contrast note (Task 8): white small text on --clay #c4674a measures
     ~3.9:1 — under the 4.5:1 WCAG small-text line. Solid grounds that carry
     white text (Next slot, Log button, primary sheet action) use --clay-fill
     #b05b40 (4.75:1 against #fff) instead. Small clay text on paper
     (.factline .go "open →", .turn b — 12px/700) uses --clay-deep #8a4630
     (6.50:1 on --paper; --clay itself is only 3.62:1 there). --clay stays
     the accent for hero italics (24.5px = large text, 3:1 applies) and for
     borders. White on --pine #3d5a4c is 7.6:1 — fine as is. */
  :root{--paper:#faf6f0;--card:#fff;--ink:#2b2118;--mut:#7a6c5c;--clay:#c4674a;--clay-fill:#b05b40;--clay-deep:#8a4630;--clay-soft:#f3e4d3;--pine:#3d5a4c;--pine-soft:#e4ebe6;--line:#e6ddd1;--alert:#9c3a2a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{max-width:430px;margin:0 auto;min-height:100dvh;background:var(--paper);font-family:'Albert Sans',sans-serif;color:var(--ink)}
  #page{padding:22px 24px 120px}

  /* check-in (styles copied from postpal-concept-daybook-coalesced.html v7) */
  .status{display:flex;justify-content:space-between;font-size:11px;font-weight:600;color:var(--mut)}
  .eyebrow{font-size:11px;letter-spacing:.14em;font-weight:700;color:var(--pine)}
  .bigtext{font-family:'Petrona',serif;font-weight:500;font-size:24.5px;line-height:1.36;margin-top:12px}
  .bigtext em{font-style:italic;color:var(--clay)}

  /* faces */
  .facelab{font-size:11px;letter-spacing:.16em;font-weight:700;color:var(--mut)}
  .faces{display:flex;gap:10px;margin-top:14px}
  .face{flex:1;aspect-ratio:1/1.18;background:var(--card);border:1px solid var(--line);border-radius:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(43,33,24,.05);cursor:pointer;padding:0;font:inherit}
  .face svg{width:80%;height:auto}
  .facecap{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut);margin-top:10px;font-style:italic;font-family:'Petrona',serif}
  .face.sel{border-color:var(--clay);box-shadow:0 2px 8px rgba(138,70,48,.12)}

  /* receipt rows — hero-scale, the whole row is the tap target (v7) */
  .herorow{padding-bottom:16px;border-bottom:1px solid var(--line)}
  .receipt{display:flex;align-items:center;gap:13px;padding:16px 2px;border-bottom:1px solid var(--line)}
  .rface{flex:none;display:flex}
  .rdot{flex:none;width:30px;height:30px;border-radius:50%;background:var(--pine-soft);display:flex;align-items:center;justify-content:center;color:var(--pine);font-size:15px;font-weight:700}
  .rtext{font-family:'Petrona',serif;font-size:24.5px;font-weight:500;line-height:1.3}
  .rtext em{font-style:italic;color:var(--pine)}
  .tappable{cursor:pointer}
  /* transient acknowledgment under the face receipt — noted phase only
     (the .facedone treatment from the v3 concept) */
  .ackline{font-family:'Petrona',serif;font-style:italic;font-size:13.5px;color:var(--pine);margin-top:10px}

  /* page content — the question-led chapters (v7 state 3) */
  .sect{margin-top:24px}
  .sect h5{font-family:'Petrona',serif;font-size:18.5px;font-weight:500;font-style:italic;color:var(--ink);border-top:1px solid var(--line);padding-top:14px}
  .factline{display:flex;align-items:baseline;gap:8px;font-size:13px;margin-top:10px;line-height:1.5}
  .factline .k{flex:none;font-size:10.5px;letter-spacing:.12em;font-weight:700;color:var(--mut);width:74px}
  .factline .v{font-family:'Petrona',serif;font-size:14px}
  .factline .v b{font-family:'Albert Sans';font-size:11.5px;font-weight:700;color:var(--clay-deep)}
  .factline .v .ok{color:var(--pine);font-weight:600}
  .factline .go{margin-left:auto;color:var(--clay-deep);font-weight:700;font-size:12px;white-space:nowrap}
  button.go{background:none;border:none;padding:0;font-family:'Albert Sans',sans-serif;cursor:pointer}
  .entry{margin-top:16px}
  .entry .body{font-family:'Petrona',serif;font-size:15px;line-height:1.6}
  .entry .body b{font-weight:600}
  .marginnote{display:block;font-family:'Petrona',serif;font-style:italic;font-size:12.5px;color:var(--clay-deep);margin-top:9px;padding-left:11px;border-left:2px solid var(--clay)}
  .turn{font-size:12px;font-weight:700;color:var(--mut);margin-top:4px}
  .turn b{color:var(--clay-deep)}
  .scrollhint{text-align:center;color:var(--mut);font-size:15px;letter-spacing:.2em;margin:6px 0}

  /* prototype edges: things that look tappable but go nowhere yet — pressed state only */
  .noop{cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
  .noop:active{opacity:.5}

  /* note chips (v7) */
  .chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:10px} /* 9px: the chip ::before hit areas extend 4.5px each way — wrapped rows would contest a pixel at 8px */
  .chip{font-family:'Albert Sans',sans-serif;font-size:12.5px;font-weight:600;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 14px;cursor:pointer}

  /* "Something else…" inline note input */
  .notein{display:flex;align-items:center;gap:8px;margin-top:10px}
  .notein input{flex:1;min-width:0;font-family:'Albert Sans',sans-serif;font-size:13px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 14px;outline:none}
  .notein input:focus{border-color:var(--clay)}
  .notebtn{font-family:'Albert Sans',sans-serif;font-size:12.5px;font-weight:600;color:var(--clay-deep);background:none;border:none;padding:9px 4px;cursor:pointer;white-space:nowrap}
  .notebtn.quiet{color:var(--mut);font-weight:500}

  /* Next-slot bottom nav — Option 3 pair, styles copied from
     postpal-bottom-nav-options.html. Tones are classes here (the concept
     file used inline styles in its crops): clay = urgent/dose,
     pine = calm milestone/cycle. */
  #nextbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--paper);border-top:1px solid var(--line);padding:12px 24px calc(12px + env(safe-area-inset-bottom));z-index:50}
  .pair{display:flex;gap:9px}
  .pair .next{flex:1.5;background:var(--clay-fill);border:none;border-radius:999px;padding:11px 16px;color:#fff;display:flex;align-items:center;gap:10px;text-align:left;font-family:'Albert Sans',sans-serif;cursor:pointer}
  .pair .next.tone-clay{background:var(--clay-fill)}
  .pair .next.tone-pine{background:var(--pine)}
  /* .k/.v small opacities bumped from .8/.85 (concept) for legibility on the
     darker fill; the 9px NEXT micro-label is supplementary — the slot's
     meaning is carried by the 13px label and the aria-label. */
  .pair .next .k{font-size:9px;letter-spacing:.16em;font-weight:700;opacity:.9}
  .pair .next .v{font-size:13px;font-weight:700;line-height:1.25}
  .pair .next .v small{display:block;font-weight:600;font-size:10.5px;opacity:.95}
  .pair .feel{flex:1;border:1.5px solid var(--line);background:var(--card);color:var(--mut);border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;padding:0 8px;font-family:'Albert Sans',sans-serif;cursor:pointer}

  /* ===== Sheet system =====
     Overlay styles copied from postpal-bottom-nav-options.html (.dim, .sheet,
     .grab, .sheettitle, .tl rail, .meter, .quietline, .paired) and from
     postpal-concept-1-nurse-line.html state 2 (.tag, sheet h4/p, .threshold,
     .sheetacts, .btn). Positions adapted: the concepts anchored these
     position:absolute inside a phone frame; here they fix to the 430px
     viewport column, centered like #nextbar. */
  #sheet-root .dim{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(43,33,24,.32);opacity:0;z-index:60}
  #sheet-root .sheet{position:fixed;bottom:0;left:0;right:0;width:100%;max-width:430px;margin:0 auto;background:var(--paper);border-radius:26px 26px 0 0;padding:16px 22px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -12px 40px rgba(43,33,24,.25);max-height:82dvh;overflow-y:auto;transform:translateY(100%);z-index:61;outline:none}
  #sheet-root.open .dim{opacity:1}
  #sheet-root.open .sheet{transform:translateY(0)}
  #sheet-root:not(.open) .dim,#sheet-root:not(.open) .sheet{pointer-events:none}
  .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px;cursor:pointer}
  .sheettitle{font-family:'Petrona',serif;font-size:20px;font-weight:500}

  /* med rail */
  .tlgroup{font-size:10px;letter-spacing:.16em;font-weight:700;color:var(--mut);margin:16px 0 2px}
  .tlgroup.now{color:var(--clay-deep)}
  .tl{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
  .tl .tm{flex:none;width:44px;font-size:11.5px;font-weight:700;color:var(--mut)}
  .tl .med{font-family:'Petrona',serif;font-size:15.5px}
  .tl .med small{display:block;font-family:'Albert Sans';font-size:11px;color:var(--mut);font-weight:600;margin-top:1px}
  .tl.done{opacity:.4}
  .tl.done .med{text-decoration:line-through;text-decoration-thickness:1px}
  .tl.now{background:var(--clay-soft);border-radius:12px;padding:12px 12px;border-bottom:none;margin:6px -2px}
  .tl.now .tm{color:var(--clay-deep)}
  .tl .log{margin-left:auto;background:var(--clay-fill);color:#fff;border:none;border-radius:999px;font-size:12px;font-weight:700;padding:9px 16px;white-space:nowrap;font-family:'Albert Sans',sans-serif;cursor:pointer}
  .tl .log:active{background:var(--clay-deep)}
  .tl .ok{margin-left:auto;font-size:11px;font-weight:700;color:var(--pine);white-space:nowrap}
  .tl .cd{margin-left:auto;font-size:11px;font-weight:700;color:var(--clay-deep);white-space:nowrap}
  .meter{display:flex;align-items:center;gap:10px;margin-top:12px}
  .meter .lab{font-size:10px;letter-spacing:.12em;font-weight:700;color:var(--mut);white-space:nowrap}
  .meter .bar{flex:1;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
  .meter .bar i{display:block;height:100%;background:var(--pine)}
  .quietline{font-family:'Petrona',serif;font-style:italic;font-size:13.5px;color:var(--pine);margin-top:14px}
  .paired{font-size:11.5px;color:var(--mut);margin-top:8px}
  .sheetnote{font-size:11.5px;color:var(--mut);margin-top:14px}
  .cc-back{font-family:'Petrona',serif;font-size:14.5px;font-weight:600;color:var(--pine);padding:8px 0 10px;border-bottom:1px solid var(--line)}

  /* cycle check-in pills (from the nav-options WEEK 7 crop) */
  .cyc-pills{display:flex;gap:8px;margin-top:14px}
  /* min-height 44px is a real (visible) bump from the ~38px nav-options crop —
     a lone answer row inside a sheet, so the extra height reads fine. */
  .cyc-pill{flex:1;min-height:44px;text-align:center;font-size:11.5px;font-weight:700;color:var(--mut);background:none;border:1px solid var(--line);border-radius:999px;padding:11px 0;font-family:'Albert Sans',sans-serif;cursor:pointer}
  .cyc-pill.sel{background:var(--pine-soft);color:var(--pine);border-color:var(--pine-soft)}

  /* interpreter (nurse-line state 2) */
  .tag{font-size:10.5px;font-weight:700;letter-spacing:.16em;color:var(--pine)}
  .sheet h4{font-family:'Petrona',serif;font-size:21px;font-weight:500;line-height:1.3;margin:8px 0 10px}
  .sheet p{font-size:14px;line-height:1.6;color:#5a4d40}
  .threshold{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:14px;font-size:13px}
  .threshold b{color:var(--alert)}
  .sheetacts{display:flex;gap:10px;margin-top:16px}
  .btn{flex:1;text-align:center;border:none;background:none;border-radius:999px;padding:13px 10px;font-weight:700;font-size:13.5px;font-family:'Albert Sans',sans-serif;cursor:pointer}
  .btn.primary{background:var(--clay-fill);color:#fff}
  .btn.primary:active{background:var(--clay-deep)}
  .btn.ghost{border:1.5px solid var(--line);color:var(--mut)}
  .btn.ghost:active{background:var(--card)}

  /* interpreter — information-first redesign (source: docs/design/interpreter-components-070826) */
  .threshold .lab{display:block;font-size:10px;letter-spacing:.12em;font-weight:700;color:var(--mut);margin-bottom:3px}
  .threshold.gate{background:var(--clay-soft);border-color:#e7cdb6}
  .askrow{margin-top:18px}
  .asklab{display:block;font-size:10.5px;letter-spacing:.14em;font-weight:700;color:var(--mut);text-align:center;margin-bottom:10px}
  .gatelead{font-family:'Petrona',serif;font-size:18.5px;font-weight:500;line-height:1.32;margin-bottom:4px}
  .gatecalm{font-size:13px;color:var(--mut);line-height:1.55;margin-top:12px}
  .emerg{display:flex;gap:8px;align-items:flex-start;font-size:11.5px;color:var(--mut);margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
  .emerg b{color:var(--alert);font-weight:700}

  /* ===== Tap targets (Task 8 sweep) =====
     Visual sizes keep v7 fidelity; small controls — chips, the Log button,
     the grab handle, the meds "open →", the note-input buttons — get an
     invisible ::before overlay that extends the hit area to ≥44px tall (a
     pseudo-element is part of its button for hit-testing). Faces (~68×80),
     receipts (~62px), and the Next pair (~48px) already clear 44px. The day
     switcher is exempt — dev control, not product. */
  .chip{position:relative}
  .chip::before{content:"";position:absolute;left:0;right:0;top:-4.5px;bottom:-4.5px} /* ~35px → 44px; needs the 9px .chips gap so wrapped rows' overlays don't overlap */
  .tl .log{position:relative}
  .tl .log::before{content:"";position:absolute;left:-4px;right:-4px;top:-6px;bottom:-6px} /* ~32px → 44px, inside the roomy NOW row */
  .grab{position:relative}
  .grab::before{content:"";position:absolute;left:-80px;right:-80px;top:-12px;bottom:-28px} /* 4px handle → 44×200 close target, kept inside the sheet */
  button.go{position:relative}
  button.go::before{content:"";position:absolute;left:-8px;right:-8px;top:-15px;bottom:-15px} /* ~14px text button → ≥44px; only static text sits in the spill */
  .notebtn{position:relative}
  .notebtn::before{content:"";position:absolute;left:-4px;right:-4px;top:-6px;bottom:-6px} /* ~33px → ≥44px; the .notein 8px gap means adjacent overlays touch, not overlap */
  .notebtn.quiet::before{right:-6px} /* "back" is the narrowest control and ends the row — widen outward to clear 44px square */

  /* ===== Motion (Task 8) =====
     Every transition/animation lives behind prefers-reduced-motion:
     no-preference. With reduced motion everything appears instantly; the
     sheet still opens/closes correctly because its enter is class-driven and
     its exit cleanup uses a plain timeout (renderSheet), never transitionend. */
  @media (prefers-reduced-motion: no-preference){
    #sheet-root .dim{transition:opacity 240ms ease-out}
    #sheet-root .sheet{transition:transform 240ms ease-out}
    @keyframes settle{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    /* receipts/chips/chapters settle in; per-element stagger via --d */
    .settle{animation:settle 200ms ease-out both;animation-delay:var(--d,0ms)}
  }

  /* dev-only day switcher — deliberately not product-styled.
     Sits below the status line ("9:41 · Maya · UFE Feb 12") so the two
     never overlap at 430px. */
  #day-switcher{position:fixed;top:42px;right:10px;display:flex;gap:4px;z-index:100}
  .day-pill{font-family:'Albert Sans',sans-serif;font-size:10px;font-weight:600;color:#888;background:#eee;border:1px solid #ccc;border-radius:10px;padding:2px 7px;cursor:pointer}
  .day-pill.active{color:#fff;background:#888;border-color:#888}
</style>
</head>
<body>
<div id="day-switcher" aria-label="Prototype day switcher (dev control)">
  <button class="day-pill" data-day="1">1</button>
  <button class="day-pill" data-day="3">3</button>
  <button class="day-pill" data-day="5">5</button>
  <button class="day-pill" data-day="10">10</button>
  <button class="day-pill" data-day="20">20</button>
</div>

<main id="page"></main>

<nav id="nextbar"></nav>

<div id="sheet-root"></div>

<script>
/* ============================================================
   DAYS — the five-day content model.
   Patient: Maya · UFE Feb 12. Clinic contact: Carrie, PA-C.
   Copy grounded in docs/design/postpal-research-060926/ and the
   AVC UAE discharge packet. Day 5 lifted verbatim from
   postpal-concept-daybook-coalesced.html (v7).
   ============================================================ */
const DAYS = {

    feel: [

    ahead: [

        { label: "NEXT · IN 40 MIN", rows: [["1:00","Ibuprofen 800|take with food","LOG"]], now: true },
        { label: "LATER TODAY", rows: [["6:00","Ibuprofen 800",""],["9:00","Cyclobenzaprine 10 + stool softener",""]] },

      ],

    },
    interpreters: {
      "Cramping is intense": { tag: "EXPECTED ON DAY 1", head: "Strong, wave-like cramping is the procedure working.",
        body: "Most women describe day 1 as the hardest — cramping like a very strong period, sometimes worse. It fades over the next two to three days.",
        threshold: "Your clinic's line: call if pain is <b>not controlled by your scheduled medicines</b> — that's what the PRN dose is for, and what Carrie wants to hear about." },
      "Fever or chills": { tag: "EXPECTED ON DAY 1", head: "A low fever tonight is your body responding.",
        body: "Up to about 101°F with flu-like aches is common in the first three days.",
        threshold: "Call if it reaches <b>101°F</b>, or comes with foul-smelling discharge." },
      "Nausea": { tag: "EXPECTED ON DAY 1", head: "Nausea is usually the medicines, not a problem.",
        body: "The pain medicines cause it. Zofran is on your PRN list for exactly this. Small bland meals help.",
        threshold: "Call if you <b>can't keep fluids down</b> — that one matters." }
    }
  },
  3: {
    eyebrow: "DAY 3 · MORNING CHECK-IN",
    heroFull: "The fever and flu-like feeling usually break around now — <em>cramping fades with them. If yours hasn't yet, you're not behind.</em>",
    heroShort: "The fever usually breaks around now<em>…</em>",
    chips: ["Nothing new", "Still feverish", "Cramping more", "Tired all day", "Something else…"],
    ack: { better: "Noted — a better day than yesterday.", same: "Noted — about the same.", worse: "Noted — a rough patch. Day 3 can be one." },
    feel: [
      { body: "<b>The flu-like feeling has a name.</b> Post-embolization syndrome: low fever, aches, fatigue. It peaks around now and then lets go.",
        note: "Carrie, PA-C — \"Day 3 is when most of my calls come. Almost all of them are this.\"" },
      { body: "<b>Hot and cold flashes at night</b> are part of the same response — not an infection by themselves." }
    ],
    turn: "eating &amp; energy",
    back: "driving ✓ · showers ✓ · normal meals ✓",
    notYet: "lifting &gt;10 lb <b>4d</b> · baths &amp; pools <b>11d</b> · tampons <b>11d</b>",
    meds: { k: "SO FAR", line: "3 of 6 doses taken · next: ibuprofen 800 at 1:00", sheet: "medrail" },
    ahead: [
      { k: "DAY 5", v: "The medicine schedule starts stepping down" },
      { k: "FEB 26", v: "Telehealth with Carrie, PA-C (day 14)", details: true }
    ],
    next: { label: "Ibuprofen 800", sub: "in 3 h", tone: "clay", sheet: "medrail" },
    medrail: {
      title: "Your medicines · day 3",
      groups: [
        { label: "THIS MORNING", rows: [["8:00","Cyclobenzaprine 10","taken 8:10 ✓"],["8:00","Ibuprofen 800","taken 8:10 ✓"],["8:00","Metformin — back on schedule","taken ✓"]], done: true },

/* One factory for the per-day UI state — the day pills and initial load both
   use it, so a day switch always lands on a clean check-in with no open sheet. */
function freshState(day) {
  return { day, phase: "checkin", face: null, note: null, heroExpanded: false, noteInputOpen: false, noteDraft: "", sheet: null };
}
let state = freshState(5);

/* One-time self-check of the content model — logs violations, runs on load. */
(function selfCheckDays() {
  const errors = [];
  const requiredDayFields = ["eyebrow", "heroFull", "heroShort", "chips", "ack", "feel", "turn", "ahead", "next"];
  const chipsWithoutInterpreters = new Set(["Nothing new", "Something else…"]);
  const expectedDayKeys = ["1", "3", "5", "10", "20"];
  const actualDayKeys = Object.keys(DAYS);
  if (actualDayKeys.join(",") !== expectedDayKeys.join(",")) {
    errors.push(`DAYS keys are [${actualDayKeys}] — expected exactly [${expectedDayKeys}]`);
  }
  for (const d of [1, 3, 5, 10, 20]) {
    const day = DAYS[d];
    if (!day) { errors.push(`Day ${d} is missing from DAYS`); continue; }
    for (const field of requiredDayFields) {
      if (day[field] == null) errors.push(`Day ${d} is missing "${field}"`);
    }
    if (day.next && day.next.sheet && !day[day.next.sheet]) {
      errors.push(`Day ${d} next.sheet "${day.next.sheet}" has no matching sheet object`);
    }
    if (day.meds) {
      for (const field of ["line", "sheet", "k"]) {
        if (!day.meds[field]) errors.push(`Day ${d} meds is missing "${field}"`);
      }
      if (day.meds.sheet && !day[day.meds.sheet]) {
        errors.push(`Day ${d} meds.sheet "${day.meds.sheet}" has no matching sheet object`);
      }
    }
    if (day.back == null && day.notYet == null) {
      errors.push(`Day ${d} has neither "back" nor "notYet" — the can/can't chapter would render bare`);
    }
    for (const chip of day.chips || []) {
      if (chipsWithoutInterpreters.has(chip)) continue;
      if (!day.interpreters || !day.interpreters[chip]) errors.push(`Day ${d} chip "${chip}" has no matching interpreter`);
    }
    for (const [chip, interp] of Object.entries(day.interpreters || {})) {
      for (const field of ["tag", "head", "body", "threshold"]) {
        if (!interp[field]) errors.push(`Day ${d} interpreter "${chip}" is missing "${field}"`);
      }
    }
  }
  if (errors.length) errors.forEach(e => console.error("DAYS self-check:", e));
  else console.log("DAYS self-check passed");
})();

   content by kind: medrail / cancant / cycle / interpreter / feel.
   Sheet state lives in state.sheet so day switches and phase
   changes close it for free: render() owns #sheet-root.
   ============================================================ */
const SHEET_LABELS = {

  cancant: "What you can do — and not yet",
  cycle: "Cycle check-in",
  interpreter: "What this symptom means",
  feel: "What are you feeling?"

function openSheet(kind, payload = null, openerSel = null) {

/* Log the NOW dose: strike it into the done group, promote the first LATER
   row into the NOW group, and point day.next at the following dose. Mutates
   the in-memory DAYS — state resets on reload, which is fine for a prototype. */
function logNowDose(day) {
  const rail = day.medrail;
  const nowGroup = rail.groups.find(g => g.now);
  if (!nowGroup || !nowGroup.rows.length) return;
  const [tm, name] = nowGroup.rows.shift();
  let doneGroup = rail.groups.find(g => g.done);
  if (!doneGroup) {
    doneGroup = { label: "EARLIER TODAY", rows: [], done: true };
    rail.groups.unshift(doneGroup);
  }
  doneGroup.label = "EARLIER TODAY"; /* "THIS MORNING" no longer covers a 1:00 dose */
  doneGroup.rows.push([tm, name.split("|")[0], "taken just now ✓"]);
  /* first remaining scheduled (non-PRN) row becomes the NOW dose */
  const laterGroup = rail.groups.find(g => !g.done && !g.now && g.rows.length && g.rows[0][0] !== "PRN");
  let promoted = null;
  if (laterGroup) {
    promoted = laterGroup.rows.shift();
    if (!laterGroup.rows.length) rail.groups.splice(rail.groups.indexOf(laterGroup), 1);
    nowGroup.rows.push([promoted[0], promoted[1], "LOG"]);
    nowGroup.label = "NEXT · LATER TODAY";
    day.next.label = promoted[1].split("|")[0];
    day.next.sub = `${promoted[0]} · later today`;
  } else {
    rail.groups.splice(rail.groups.indexOf(nowGroup), 1);
    /* terminal: the schedule is finished — don't leave the last medicine's
       name in the Next slot; flip it to a calm pine milestone instead */
    day.next.label = "Medicines done";
    day.next.sub = "nothing more until morning"; /* the label already says "done" — don't double it */
    day.next.tone = "pine";
  }
  /* keep the page's meds chapter in step with the rail */
  if (day.meds) {
    const counts = day.meds.line.match(/^(\d+) of (\d+) doses taken/);
    if (counts) {
      day.meds.line = promoted
        ? `${Number(counts[1]) + 1} of ${counts[2]} doses taken · next: ` +
          `${promoted[1].split("|")[0].replace(/^./, c => c.toLowerCase())} at ${promoted[0]}`
        : "All scheduled doses taken today";
    }
  }
}

function medRowHTML([tm, name, status], group) {
  const [main, sub] = name.split("|");
  const cls = "tl" + (group.done ? " done" : "") + (group.now ? " now" : "");
  let right = "";
  if (status === "LOG") right = '<button class="log" id="log-btn">Log it</button>';
  else if (status) right = `<span class="ok">${status}</span>`;
  return `<div class="${cls}"><span class="tm">${tm}</span>` +
    `<span class="med">${main}${sub ? `<small>${sub}</small>` : ""}</span>${right}</div>`;
}

function medrailHTML(rail) {
  const groups = rail.groups.map(g =>
    `<div class="tlgroup${g.now ? " now" : ""}">${g.label}</div>` +
    g.rows.map(r => medRowHTML(r, g)).join("")
  ).join("");
  const [val, max, label] = rail.meter;
  const pct = max ? Math.round((val / max) * 100) : 0;
  return `
    <div class="sheettitle">${rail.title}</div>
    ${groups}
    <div class="meter"><span class="lab">${label}</span><span class="bar"><i style="width:${pct}%"></i></span><span class="lab">${val} / ${max} MG</span></div>
    <div class="quietline">${rail.quiet}</div>
    ${rail.paired ? `<div class="paired">${rail.paired}</div>` : ""}`;
}

function cancantHTML(cc) {
  const notYetRows = cc.notYet.map(([name, countdown]) =>
    `<div class="tl"><span class="med">${name}</span><span class="cd">${countdown}</span></div>`).join("");
  return `

    <div class="tlgroup">BACK</div>
    <div class="cc-back">${cc.back}</div>
    <div class="tlgroup">NOT YET</div>

}

function cycleHTML(cy) {

    `<button class="cyc-pill${cy.selected === opt ? " sel" : ""}" data-opt="${i}" aria-pressed="${cy.selected === opt}">${opt}</button>`).join("");

    const care = interp.care || SELF_CARE_DEFAULT;
    return `
    <div class="gatelead">Here's the line to watch — and what helps right now.</div>
    <div class="threshold gate">${alertIcon}<span><span class="lab">THE ONE THING TO WATCH FOR</span>${interp.threshold}</span></div>
    <p class="gatecalm">${care}</p>
    <div class="emerg">${alertIcon}<span>${EMERGENCY_LINE}</span></div>
    <div class="sheetacts">
      <button class="btn ghost" id="act-gotit">Back to today</button>
    </div>`;
  }

  /* answer view — default */
  return `
    <span class="tag">${interp.tag}</span>
    <h4>${interp.head}</h4>
    <p>${interp.body}</p>
    <div class="threshold">${alertIcon}<span><span class="lab">THE ONE LINE YOUR CLINIC WATCHES</span>${interp.threshold}</span></div>
    <div class="askrow">
      <span class="asklab">DID THIS ANSWER YOUR QUESTION?</span>
      <div class="sheetacts">
        <button class="btn primary" id="act-yes">Yes, that helps</button>
        <button class="btn ghost" id="act-notquite">Not quite</button>
      </div>
    </div>`;
}

function feelHTML(day) {
  /* interpreter keys are matched by index — day content never lands in attributes */
  const chips = Object.keys(day.interpreters).map((k, i) =>
    `<button class="chip" data-k="${i}">${k}</button>`).join("");
  return `
    <div class="sheettitle">What are you feeling?</div>
    <div class="chips" style="margin-top:14px">
      ${chips}
      <button class="chip" data-k="else">Something else…</button>
    </div>`;
}

function sheetBodyHTML(day) {
  const { kind, payload } = state.sheet;
  switch (kind) {
    case "medrail": return medrailHTML(day.medrail);
    case "cancant": return cancantHTML(day.cancant);
    case "cycle": return cycleHTML(day.cycle);
    case "interpreter": return interpreterHTML(day.interpreters[payload.key], payload);
    case "feel": return feelHTML(day);
    default:
      console.error(`sheetBodyHTML(): unknown sheet kind "${kind}"`);
      return "";
  }
}

function wireSheet(root, day) {
  root.querySelector(".dim").addEventListener("click", closeSheet);
  root.querySelector(".grab").addEventListener("click", closeSheet);
  const { kind, payload } = state.sheet;
  if (kind === "medrail") {
    const logBtn = root.querySelector("#log-btn");
    if (logBtn) logBtn.addEventListener("click", () => {
      logNowDose(day);
      render(); /* rail re-renders in place; the Next slot updates with it */
    });
  } else if (kind === "cycle") {
    root.querySelectorAll(".cyc-pill").forEach(pill => {
      pill.addEventListener("click", () => {
        day.cycle.selected = day.cycle.options[Number(pill.dataset.opt)];
        render(); /* re-render reveals the footnote as the confirmation line */
      });
    });
  } else if (kind === "interpreter") {
    /* the worry never blocks the page: from a check-in chip, resolving ("Yes")
       or acknowledging the escalation ("Back to today") records the note and
       lands on the page; from "Feeling something?" they just close. "Not quite"
       swaps to the escalated view in place, keeping the same opener. */
    const resolve = () => {
      if (payload.origin === "chips") {
        state.note = payload.key.toLowerCase();
        state.phase = "page";
      }
      closeSheet();
    };
    if (payload.escalated) {
      root.querySelector("#act-gotit").addEventListener("click", resolve);
    } else {
      root.querySelector("#act-yes").addEventListener("click", resolve);
      root.querySelector("#act-notquite").addEventListener("click",
        () => openSheet("interpreter", { ...payload, escalated: true }));
    }
  } else if (kind === "feel") {
    const keys = Object.keys(day.interpreters);
    root.querySelectorAll(".chip").forEach(btn => {
      btn.addEventListener("click", () => {
        if (btn.dataset.k === "else") {
          /* in the noted phase, route to the inline note input; elsewhere just close */
          if (state.phase === "noted") state.noteInputOpen = true;
          closeSheet();
        } else {
          /* swap the open sheet's content to the interpreter */
          openSheet("interpreter", { key: keys[Number(btn.dataset.k)], origin: "feel" });
        }
      });
    });
  }
}

function renderSheet() {
  const root = document.getElementById("sheet-root");
  if (!state.sheet) {
    if (root.classList.contains("open")) {
      /* slide out, then clear — guarded, another sheet may open meanwhile */
      root.classList.remove("open");
      clearTimeout(sheetExitTimer);
      sheetExitTimer = setTimeout(() => { if (!state.sheet) root.innerHTML = ""; }, 280);
    }
    return;
  }
  clearTimeout(sheetExitTimer);
  const wasOpen = root.classList.contains("open");
  const day = DAYS[state.day];
  root.innerHTML = `
    <div class="dim"></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" tabindex="-1"
      aria-label="${SHEET_LABELS[state.sheet.kind] || "Sheet"}">
      <div class="grab" aria-hidden="true"></div>
      ${sheetBodyHTML(day)}
    </div>`;
  wireSheet(root, day);
  if (!wasOpen) {
    /* fresh open: start translated offscreen, then slide up (instant when the
       transition is disabled by reduced motion — .open alone positions it).
       Content swaps while open rebuild inside the already-.open root — no
       slide replay; their focus is handled below. */
    requestAnimationFrame(() => requestAnimationFrame(() => root.classList.add("open")));
    root.querySelector("#sheet").focus({ preventScroll: true });
  } else if (document.activeElement === document.body) {
    /* in-place rebuild (Log, cycle-pill select, feel → interpreter swap)
       threw away the focused control with the old DOM, dropping focus to
       <body>. Re-focus its successor so keyboard flow continues: the new
       Log button, else the chosen cycle pill, else the sheet itself. */
    const successor = root.querySelector("#log-btn")
      || root.querySelector(".cyc-pill.sel")
      || root.querySelector("#sheet");
    successor.focus({ preventScroll: true });
  }
}

/* .settle keyframes replay on every innerHTML rebuild, and render() reruns
   the same view for plenty of reasons (hero toggle, sheet open/close, dose
   log) — the lower chapters would blink each time. Only the first render of
   a given day+phase gets the .settle classes; same-view rebuilds skip them. */
let lastSettleKey = null;

function render() {
  const day = DAYS[state.day];
  const page = document.getElementById("page");
  const settleKey = `${state.day}:${state.phase}`;
  const settleCls = settleKey === lastSettleKey ? "" : " settle";
  lastSettleKey = settleKey;

  if (state.phase === "checkin") {
    /* Calm budget: eyebrow, hero, the one ask — nothing else.
       Returning from a face-receipt tap keeps the chosen face preselected. */
    page.innerHTML = `
      ${STATUS_HTML}
      <div style="margin-top:44px">
        <div class="eyebrow">${day.eyebrow}</div>
        <div class="bigtext">${day.heroFull}</div>
      </div>
      <div style="margin-top:36px">
        <span class="facelab">HOW DOES TODAY FEEL?</span>
        <div class="faces">
          ${FACE_MOUTHS.map((_, i) => {
            const sel = state.face === i;
            return `<button class="face${sel ? " sel" : ""}" data-face="${i}"` +
              ` aria-label="${FACE_LABELS[i]}" aria-pressed="${sel}">${faceSvg(i, { selected: sel })}</button>`;
          }).join("")}
        </div>
        <div class="facecap"><span>a good day</span><span>a hard day</span></div>
      </div>`;
    page.querySelectorAll(".face").forEach(btn => {
      btn.addEventListener("click", () => {
        state.face = Number(btn.dataset.face);
        state.phase = "noted";
        render();
      });
    });
  } else if (state.phase === "noted") {
    const ask = state.noteInputOpen
      ? `<div class="notein">
          <input type="text" id="note-input" placeholder="A few words is plenty" aria-label="Your note">
          <button class="notebtn" id="note-submit">note it</button>
          <button class="notebtn quiet" id="note-cancel" aria-label="Back to the choices">back</button>
        </div>`
      : `<div class="chips">
          ${day.chips.map((c, i) => `<button class="chip" data-chip="${i}">${c}</button>`).join("")}
        </div>`;
    page.innerHTML = `
      ${STATUS_HTML}
      ${heroBlockHTML(day, 34)}
      ${faceReceiptHTML(settleCls)}
      <div class="ackline${settleCls}" id="ack-line" style="--d:100ms">${day.ack[faceAckKey(state.face)]}</div>
      <div class="${settleCls.trim()}" style="margin-top:22px;--d:200ms">
        <span class="facelab" style="color:var(--pine)">ANYTHING TO NOTE TODAY?</span>
        ${ask}
      </div>`;
    wireHeroAndFaceReceipt(page);
    if (state.noteInputOpen) {
      const input = page.querySelector("#note-input");
      input.value = state.noteDraft; /* survive hero-toggle re-renders */
      const submit = () => {
        const text = input.value.trim();
        if (!text) return;
        state.note = text;
        state.noteDraft = "";
        state.noteInputOpen = false;
        state.phase = "page";
        render();
      };
      const cancel = () => {
        state.noteDraft = "";
        state.noteInputOpen = false;
        render();
      };
      page.querySelector("#note-submit").addEventListener("click", submit);
      page.querySelector("#note-cancel").addEventListener("click", cancel);
      input.addEventListener("input", () => { state.noteDraft = input.value; });
      input.addEventListener("keydown", e => {
        if (e.key === "Enter") submit();
        else if (e.key === "Escape") cancel();
      });
      input.focus();
    } else {
      page.querySelectorAll(".chip").forEach(btn => {
        btn.addEventListener("click", () => {
          const chip = day.chips[Number(btn.dataset.chip)];
          if (chip === "Nothing new") {
            state.note = "nothing new";
            state.phase = "page";
          } else if (chip === "Something else…") {
            state.noteInputOpen = true;
          } else {
            /* interpreter first — its actions record the note and advance to
               the page (openSheet renders; no fall-through render needed) */
            openSheet("interpreter", { key: chip, origin: "chips" }, `[data-chip="${btn.dataset.chip}"]`);
            return;
          }
          render();
        });
      });
    }
  } else if (state.phase === "page") {
    /* The whole page, organized (v7 state 3): hero + two receipts above the
       fold, then the question-led chapters. Chapters 2 and 3 shrink as the
       recovery does — BACK/NOT YET lines drop when null, the medicines
       chapter disappears entirely once meds is null (day 20). */
    const feelEntries = day.feel.map(e => `
        <div class="entry">
          <p class="body">${e.body}</p>
          ${e.note ? `<span class="marginnote">${e.note}</span>` : ""}
        </div>`).join("");
    /* "Keep reading" is a prototype edge — pressed state only, no behavior. */
    const turnLine = `<p class="turn noop" style="margin-top:12px">Keep reading: <b>${day.turn} →</b></p>`;
    const backLine = day.back
      ? `<div class="factline"><span class="k">BACK</span><span class="v"><span class="ok">${day.back}</span></span></div>`
      : "";
    const notYetLine = day.notYet
      ? `<div class="factline"><span class="k">NOT YET</span><span class="v">${day.notYet}</span></div>`
      : "";
    const medsChapter = day.meds ? `
      <div class="sect${settleCls}" style="--d:240ms">
        <h5>Your medicines today</h5>
        <div class="factline">
          <span class="k">${day.meds.k}</span>
          <span class="v">${day.meds.line}</span>
          <button class="go" id="meds-open" aria-label="Open today's medicine rail">open →</button>
        </div>
      </div>` : "";
    /* "details →" on telehealth/MRI rows is a no-op for now (sheet TBD). */
    const aheadLines = day.ahead.map(item => `
        <div class="factline">
          <span class="k">${item.k}</span>
          <span class="v">${item.v}</span>
          ${item.details ? '<span class="go noop">details →</span>' : ""}
        </div>`).join("");

    page.innerHTML = `
      ${STATUS_HTML}
      ${heroBlockHTML(day, 30)}
      ${faceReceiptHTML(settleCls)}
      <div class="receipt tappable${settleCls}" id="note-receipt" role="button" tabindex="0"
        style="--d:60ms" aria-label="Change what you noted">
        <span class="rdot">✓</span>
        <span class="rtext">Noted: <em>${esc(state.note)}</em></span>
      </div>

      <!-- chapter 1: the reading -->
      <div class="sect${settleCls}" style="--d:120ms">
        <h5>How today might feel</h5>
        ${feelEntries}
        ${turnLine}
      </div>

      <!-- chapter 2: can / can't yet -->
      <div class="sect${settleCls}" style="--d:180ms">
        <h5>What you can do — and not yet</h5>
        ${backLine}
        ${notYetLine}
      </div>

      <!-- chapter 3: meds (absent on day 20) -->
      ${medsChapter}

      <!-- chapter 4: ahead -->
      <div class="sect${settleCls}" style="--d:300ms">
        <h5>What's ahead</h5>
        ${aheadLines}
      </div>

      <div class="scrollhint${settleCls}" style="margin-top:14px;--d:300ms">⌄</div>`;
    wireHeroAndFaceReceipt(page);
    tap(page.querySelector("#note-receipt"), () => {
      state.phase = "noted";
      state.noteInputOpen = false;
      render();
    });
    const medsOpen = page.querySelector("#meds-open");
    if (medsOpen) medsOpen.addEventListener("click", () => openSheet(day.meds.sheet, null, "#meds-open"));
  } else {
    page.innerHTML = "";
    console.error(`render(): unknown phase "${state.phase}"`);
  }

  renderNextbar(day);
  renderSheet();

  document.querySelectorAll(".day-pill").forEach(pill => {
    pill.classList.toggle("active", Number(pill.dataset.day) === state.day);
  });
}

document.querySelectorAll(".day-pill").forEach(pill => {
  pill.addEventListener("click", () => {
    state = freshState(Number(pill.dataset.day)); /* sheet: null — switching days closes any open sheet */
    sheetOpenerSel = null; /* that close is implicit — a stale opener must not steal focus on a later closeSheet() */
    render();
  });
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && state.sheet) closeSheet();
});

render();
</script>
</body>
</html>
